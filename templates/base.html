
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Rose Leaf Classifier{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8f4;
            color: #24352a;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #244c36;
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #617267;
        }

        .button {
            display: inline-block;
            padding: 12px 22px;
            background: #347650;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        .button:hover {
            background: #285d3e;
        }
    </style>
</head>

<body>
    <nav>
        <a class="brand" href="{{ url_for('home') }}">
            Rose Leaf Classifier
        </a>

        <div>
            <a href="{{ url_for('home') }}">Home</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        Rose Leaf Disease Classification Project
    </footer>
</body>
</html>
